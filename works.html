    // ▼▼▼ 以下は表示サンプル。実際の作品に置き換えてください ▼▼▼
  ];

  const grid = document.getElementById("grid");
  const tagrow = document.getElementById("tagrow");
  const countEl = document.getElementById("count");
  const emptyEl = document.getElementById("empty");
  const qInput = document.getElementById("q");

  let selected = new Set();
  let query = "";

  // 全タグを集計（出現順）
  const allTags = [];
  WORKS.forEach(w => w.tags.forEach(t => { if(!allTags.includes(t)) allTags.push(t); }));

  // 他ページから works.html?tags=○○ で来たら、そのタグで初期フィルタ
  (function(){
    const p = new URLSearchParams(location.search);
    const raw = p.get('tags') || p.get('tag');
    if(raw){ raw.split(',').forEach(t => { t=t.trim(); if(t && allTags.includes(t)) selected.add(t); }); }
  })();

  // タグボタンを生成
  allTags.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t; b.dataset.tag = t;
    b.addEventListener("click", () => { toggleTag(t); });
    tagrow.appendChild(b);
  });
  // クリアボタン
  const clearBtn = document.createElement("button");
  clearBtn.className = "chip clear"; clearBtn.textContent = "すべて表示";
  clearBtn.addEventListener("click", () => { selected.clear(); query=""; qInput.value=""; render(); });
  tagrow.appendChild(clearBtn);

  function toggleTag(t){
    if(selected.has(t)) selected.delete(t); else selected.add(t);
    render();
  }

  qInput.addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

  // YouTube URL/IDから動画IDを取り出す
  function ytId(url){
    if(!url || url === "#") return null;
    const m = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function matches(w){
    for(const t of selected){ if(!w.tags.includes(t)) return false; }
    // 検索は作品名 or タグの部分一致
    if(query){
      const hay = (w.title + " " + w.tags.join(" ")).toLowerCase();
      if(!hay.includes(query)) return false;
    }
    return true;
  }

  function render(){
    // タグボタンのアクティブ表示
    tagrow.querySelectorAll(".chip[data-tag]").forEach(b => {
      b.classList.toggle("active", selected.has(b.dataset.tag));
    });
    // 新しい順にソート＆フィルタ
    const list = WORKS.slice().sort((a,b) => b.date.localeCompare(a.date)).filter(matches);
    grid.innerHTML = "";
    emptyEl.style.display = list.length ? "none" : "block";
    countEl.innerHTML = "<b>" + list.length + "</b> 件" + (selected.size||query ? " / 全 " + WORKS.length + " 件中" : "");

    list.forEach((w, i) => {
      const card = document.createElement("div");
      card.className = "card";
      const vid = ytId(w.url);
      const thumbInner = w.thumb
        ? '<img src="'+w.thumb+'" alt="'+w.title+'" onerror="this.onerror=null;this.src=this.src.replace(\'maxresdefault\',\'hqdefault\')">'
        : '<div class="noimg">'+w.title+'</div>';
      const tagsHtml = w.tags.map(t => '<span class="wtag" data-tag="'+t+'">'+t+'</span>').join("");
      const makingHtml = w.making ? '<a class="wmaking" href="'+w.making+'">メイキングを見る →</a>' : "";
      const titleHtml = w.making
        ? '<a class="wtitle" href="'+w.making+'">'+w.title+'</a>'
        : '<div class="wtitle">'+w.title+'</div>';
      card.innerHTML =
        '<div class="thumb'+(vid?' playable':'')+'"'+(vid?' data-yt="'+vid+'" role="button" tabindex="0" aria-label="再生"':'')+'>'+
          thumbInner +
          (w.is3d?'<div class="badge3d" data-glb="'+(w.glb||"")+'"'+(w.toon?' data-toon="1"':'')+(w.contrast?' data-contrast="'+w.contrast+'"':'')+(w.cam?' data-angle="'+w.cam.angle+'" data-elev="'+w.cam.elev+'" data-zoom="'+w.cam.zoom+'"'+(w.cam.env!=null?' data-env="'+w.cam.env+'"':''):'')+'>3D</div>':'')+
          (vid?'<div class="play"></div>':'')+
        '</div>'+
        '<div class="wbody">'+
          titleHtml +
          '<div class="wperiod">'+w.period+'</div>'+
          '<div class="wtags">'+tagsHtml+'</div>'+
          makingHtml +
        '</div>';
      grid.appendChild(card);
      // サムネクリックでその場再生
      const thumbEl = card.querySelector(".thumb.playable");
      if(thumbEl){
        const playVid=(e)=>{
          if(e&&e.target&&e.target.closest&&e.target.closest(".badge3d"))return;
          if(thumbEl.classList.contains("playing"))return;
          const ifr=document.createElement("iframe");
          ifr.src="https://www.youtube.com/embed/"+thumbEl.dataset.yt+"?autoplay=1&rel=0&modestbranding=1&playsinline=1";
          ifr.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
          ifr.setAttribute("allowfullscreen","");
          thumbEl.appendChild(ifr); thumbEl.classList.add("playing");
        };
        thumbEl.addEventListener("click",playVid);
        thumbEl.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();playVid();}});
      }
      // タグクリックで絞り込み
      card.querySelectorAll(".wtag").forEach(el => {
        el.addEventListener("click", () => { if(!selected.has(el.dataset.tag)) selected.add(el.dataset.tag); render(); window.scrollTo({top:0,behavior:"smooth"}); });
      });
      // タイトル/「メイキングを見る」ホバーで概要パネル
      if(w.ov){
        [card.querySelector("a.wtitle"), card.querySelector("a.wmaking")].forEach(el=>{
          if(!el) return;
          el.addEventListener("mouseenter",()=>showOv(w,el));
          el.addEventListener("mouseleave",hideOv);
          el.addEventListener("focus",()=>showOv(w,el));
          el.addEventListener("blur",hideOv);
        });
      }
      requestAnimationFrame(() => setTimeout(() => card.classList.add("in"), i*40));
    });
  }

  // 概要ホバーパネル
  const ovEl=document.getElementById("ovpanel");
  const ovEye=ovEl.querySelector(".ov-eyebrow"), ovTit=ovEl.querySelector(".ov-title"),
        ovSub=ovEl.querySelector(".ov-sub"), ovTags=ovEl.querySelector(".ov-tags"), ovTxt=ovEl.querySelector(".ov-text");
  function placeOv(el){
    const r=el.getBoundingClientRect(), pw=ovEl.offsetWidth, phh=ovEl.offsetHeight, gap=12;
    let left=r.left+r.width/2-pw/2;
    left=Math.max(12,Math.min(left,window.innerWidth-pw-12));
    let top=r.top-phh-gap;
    if(top<12) top=r.bottom+gap;
    ovEl.style.left=left+"px"; ovEl.style.top=top+"px";
  }
  function showOv(w, el){
    if(!w.ov) return;
    ovEye.textContent=w.ov.eyebrow||"";
    ovTit.textContent=w.title||"";
    ovSub.textContent=w.ov.sub||""; ovSub.style.display=w.ov.sub?"":"none";
    const tags=w.tags||[];
    ovTags.innerHTML=tags.map(t=>'<span class="ov-tag">'+t+'</span>').join("");
    ovTags.style.display=tags.length?"":"none";
    ovTxt.textContent=w.ov.text||"";
    ovEl.classList.add("show"); ovEl.setAttribute("aria-hidden","false");
    placeOv(el);
  }
  function hideOv(){ ovEl.classList.remove("show"); ovEl.setAttribute("aria-hidden","true"); }
  window.addEventListener("scroll",hideOv,true);
  window.addEventListener("resize",hideOv);

  render();
  window.addEventListener("load", () => document.body.classList.add("ready"));
  document.addEventListener("DOMContentLoaded", () => document.body.classList.add("ready"));
</script>
  <!-- 3Dビューア・モーダル -->
  <div class="v3d" id="v3d" aria-hidden="true">
    <button class="v3d-close" aria-label="閉じる">✕ CLOSE</button>
    <div class="v3d-spin"><div class="ring"></div><div class="txt">読み込み中…</div></div>
    <div class="v3d-hint">ドラッグ＝回転 ／ スクロール＝拡大縮小 ／ 右ドラッグ・2本指＝平行移動</div>
  </div>
  <script type="module">
  // 3Dバッジ → 自前モーダルビューア（modal3d.js を初回クリック時に遅延ロード）
  (function(){
    const v3d=document.getElementById("v3d"); if(!v3d) return;
    let mod=null, loading=false;
    function closeV(){ v3d.classList.remove("open"); v3d.setAttribute("aria-hidden","true"); document.body.style.overflow=""; }
    v3d.querySelector(".v3d-close").addEventListener("click",closeV);
    v3d.addEventListener("click",e=>{ if(e.target===v3d) closeV(); });
    document.addEventListener("keydown",e=>{ if(e.key==="Escape" && v3d.classList.contains("open")) closeV(); });
    document.addEventListener("click",async e=>{
      const b=e.target.closest(".badge3d[data-glb]"); if(!b) return;
      e.preventDefault(); e.stopPropagation();
      if(!mod){
        if(loading) return;
        loading=true;
        v3d.classList.add("open","loading"); v3d.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden";
        try{ mod=await import("./modal3d.js"); }
        catch(err){ console.error(err); const t=v3d.querySelector(".v3d-spin .txt"); if(t)t.textContent="読み込みに失敗しました"; return; }
        finally{ loading=false; }
      }
      mod.open({glb:b.dataset.glb, toon:b.dataset.toon==="1", contrast:b.dataset.contrast||"soft", angle:b.dataset.angle, elev:b.dataset.elev, zoom:b.dataset.zoom, env:b.dataset.env});
    });
  })();
  </script>
